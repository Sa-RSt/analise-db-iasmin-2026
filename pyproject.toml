[project]
name = "analise-db-iasmin-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Sa-RSt", email = "sasha.rodelasteidle@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "rungrid",
    "scikit-learn>=1.9.1",
    "scikit-survival>=0.28.0",
    "tenacity>=9.1.4",
    "torch",
    "torchvision",
    "uvicorn>=0.54.0",
]

[project.scripts]
analise-db-iasmin-2026 = "analise_db_iasmin_2026:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]
torchvision = [{ index = "pytorch-cuda" }]
rungrid = { path = "../rungrid", editable = true }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
